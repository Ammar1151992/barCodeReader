<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Barcode Scanner</title>

  <!-- IMPORTANT: Telegram WebApp API -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- ZXing -->
  <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>

  <style>
    body { margin: 0; background: #000; font-family: sans-serif; color: #fff; overflow: hidden; }
    .viewport { position: relative; width: 100vw; height: 80vh; }
    video { width: 100%; height: 100%; object-fit: cover; }

    .line {
      position: absolute; top: 50%; left: 10%; right: 10%;
      height: 2px; background: #00ff00;
      box-shadow: 0 0 12px #00ff00;
      z-index: 5;
    }

    .ui {
      height: 20vh; background: #fff; color: #333;
      text-align: center; padding-top: 16px; border-radius: 20px 20px 0 0;
    }
    #status { font-weight: bold; font-size: 1.1rem; }
  </style>
</head>

<body>
  <div class="viewport">
    <video id="video" autoplay playsinline muted></video>
    <div class="line"></div>
  </div>

  <div class="ui">
    <div id="status">جاري تشغيل الكاميرا...</div>
    <p style="color:#666;margin:8px 0 0;">ضع الباركود موازياً للخط الأخضر</p>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const videoEl = document.getElementById('video');

    // Telegram init
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const codeReader = new ZXing.BrowserMultiFormatReader();

    let sent = false;
    let lastText = "";
    let lastAt = 0;

    async function startScanner() {
      const constraints = {
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      };

      try {
        statusEl.textContent = "وجّه الكاميرا نحو الباركود...";
        await codeReader.decodeFromConstraints(constraints, videoEl, (result, err) => {
          if (!result) return;
          if (sent) return;

          const text = (result.getText() || "").trim();
          if (!text) return;

          // Debounce: prevent repeated triggers
          const now = Date.now();
          if (text === lastText && (now - lastAt) < 1500) return;
          lastText = text;
          lastAt = now;

          sent = true; // lock

          statusEl.textContent = "✅ تم القراءة: " + text;
          statusEl.style.color = "green";

          try {
            if (tg) {
              tg.hapticFeedback?.notificationOccurred?.('success');
              tg.sendData(text);
              // stop scanning + close mini app
              setTimeout(() => {
                codeReader.reset();
                tg.close();
              }, 200);
            } else {
              // If not opened inside Telegram, show text on screen only
              // (no popup)
              setTimeout(() => {
                sent = false;
                statusEl.style.color = "#333";
                statusEl.textContent = "وجّه الكاميرا نحو الباركود...";
              }, 2000);
            }
          } catch (e) {
            sent = false;
            statusEl.style.color = "red";
            statusEl.textContent = "❌ فشل الإرسال: " + e;
          }
        });
      } catch (error) {
        statusEl.textContent = "❌ خطأ في الكاميرا: " + (error?.message || error);
        statusEl.style.color = "red";
      }
    }

    if (!window.isSecureContext) {
      statusEl.textContent = "❌ يجب استخدام رابط HTTPS آمن";
      statusEl.style.color = "red";
    } else {
      startScanner();
    }
  </script>
</body>
</html>
