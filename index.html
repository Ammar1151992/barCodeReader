<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>Barcode Scanner</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>

    <style>
      body {
        margin: 0;
        background: #000;
        font-family: sans-serif;
        color: #fff;
        overflow: hidden;
      }
      .viewport {
        position: relative;
        width: 100vw;
        height: 75vh;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .line {
        position: absolute;
        top: 50%;
        left: 10%;
        right: 10%;
        height: 2px;
        background: #00ff00;
        box-shadow: 0 0 12px #00ff00;
        z-index: 5;
      }

      .ui {
        height: 25vh;
        background: #fff;
        color: #333;
        text-align: center;
        padding: 12px 16px;
        border-radius: 20px 20px 0 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
      }
      #status {
        font-weight: bold;
        font-size: 1rem;
      }
      #barcodeValue {
        font-size: 0.95rem;
        color: #666;
        word-break: break-all;
        min-height: 1.4em;
      }
      .countdown {
        color: #3390ec;
        font-size: 0.9rem;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="viewport">
      <video id="video" autoplay playsinline muted></video>
      <div class="line"></div>
    </div>

    <div class="ui">
      <div id="status">جاري تشغيل الكاميرا...</div>
      <div id="barcodeValue"></div>
      <div id="countdown" class="countdown"></div>
    </div>

    <script>
      const statusEl = document.getElementById("status");
      const barcodeValueEl = document.getElementById("barcodeValue");
      const countdownEl = document.getElementById("countdown");
      const videoEl = document.getElementById("video");

      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }

      const codeReader = new ZXing.BrowserMultiFormatReader();

      let sent = false;
      let lastText = "";
      let lastAt = 0;
      let currentBarcode = "";
      let sendTimeoutId = null;
      let countdownIntervalId = null;

      function sendToTelegram() {
        if (sent || !currentBarcode) return;
        var tg = window.Telegram?.WebApp;
        if (!tg) {
          statusEl.textContent = "افتح التطبيق من زر البوت داخل تيليجرام.";
          statusEl.style.color = "red";
          return;
        }
        sent = true;
        countdownEl.textContent = "";
        statusEl.textContent = "📤 جارٍ الإرسال...";
        statusEl.style.color = "#333";
        try {
          tg.sendData(JSON.stringify({ barcode: currentBarcode }));
          setTimeout(function () {
            try {
              codeReader.reset();
            } catch (e) {}
            tg.close();
          }, 500);
        } catch (e) {
          sent = false;
          statusEl.textContent = "❌ فشل الإرسال: " + (e && e.message ? e.message : e);
          statusEl.style.color = "red";
        }
      }

      function debouncedUpdateBarcode(text) {
        const now = Date.now();
        if (text === lastText && now - lastAt < 600) return;
        lastText = text;
        lastAt = now;

        if (sent) return;

        currentBarcode = text;
        barcodeValueEl.textContent = "تم القراءة: " + text;
        barcodeValueEl.style.color = "green";
        statusEl.textContent = "تم التعرف على الباركود";
        statusEl.style.color = "#333";

        if (sendTimeoutId) clearTimeout(sendTimeoutId);
        if (countdownIntervalId) clearInterval(countdownIntervalId);

        var secLeft = 1;
        countdownEl.textContent = "سيتم الإرسال خلال " + secLeft + " ثانية...";
        countdownIntervalId = setInterval(function () {
          secLeft--;
          if (secLeft <= 0) return;
          countdownEl.textContent = "سيتم الإرسال خلال " + secLeft + " ثانية...";
        }, 100);

        sendTimeoutId = setTimeout(function () {
          sendTimeoutId = null;
          if (countdownIntervalId) {
            clearInterval(countdownIntervalId);
            countdownIntervalId = null;
          }
          sendToTelegram();
        }, 3000);
      }

      async function startScanner() {
        var constraints = {
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 },
          },
        };

        try {
          statusEl.textContent = "وجّه الكاميرا نحو الباركود...";
          await codeReader.decodeFromConstraints(
            constraints,
            videoEl,
            function (result, err) {
              if (!result || sent) return;

              var text = (result.getText() || "").trim();
              if (!text) return;

              debouncedUpdateBarcode(text);
            },
          );
        } catch (error) {
          statusEl.textContent =
            "❌ خطأ في الكاميرا: " + (error && error.message ? error.message : error);
          statusEl.style.color = "red";
        }
      }

      if (!window.isSecureContext) {
        statusEl.textContent = "❌ يجب استخدام رابط HTTPS آمن";
        statusEl.style.color = "red";
      } else {
        startScanner();
      }
    </script>
  </body>
</html>
