<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Mobile Scanner</title>
  <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
  <style>
    body { margin: 0; background: #000; font-family: sans-serif; color: #fff; overflow: hidden; }
    .viewport { position: relative; width: 100vw; height: 80vh; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    /* Green Scanning Line */
    .line {
      position: absolute; top: 50%; left: 10%; right: 10%;
      height: 2px; background: #00ff00;
      box-shadow: 0 0 12px #00ff00;
      z-index: 5;
    }

    .ui { height: 20vh; background: #fff; color: #333; text-align: center; padding-top: 20px; border-radius: 20px 20px 0 0; }
    #status { font-weight: bold; font-size: 1.2rem; }
  </style>
</head>
<body>

  <div class="viewport">
    <video id="video"></video>
    <div class="line"></div>
  </div>

  <div class="ui">
    <div id="status">جاري تشغيل الكاميرا...</div>
    <p style="color: #666;">ضع الباركود موازياً للخط الأخضر</p>
  </div>

  <script>
    const codeReader = new ZXing.BrowserMultiFormatReader();
    const statusEl = document.getElementById('status');
    let scanning = true;

    async function startMobileScanner() {
      // Constraints for Mobile Back Camera
      const constraints = {
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      };

      try {
        // decodeFromConstraints is the BEST way for mobile
        await codeReader.decodeFromConstraints(constraints, 'video', (result, err) => {
          if (result && scanning) {
            scanning = false; // Stop scanning once found
            handleResult(result.getText());
          }
        });
      } catch (error) {
        statusEl.textContent = "❌ خطأ في الكاميرا: " + error.message;
      }
    }

    function handleResult(text) {
      statusEl.textContent = "✅ تم القراءة: " + text;
      statusEl.style.color = "green";

      if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.hapticFeedback.notificationOccurred('success');
        window.Telegram.WebApp.sendData(text);
      } else {
        alert("Barcode: " + text);
        setTimeout(() => { scanning = true; statusEl.style.color = "#333"; }, 2000);
      }
    }

    // Initialize
    if (window.isSecureContext) {
      startMobileScanner();
    } else {
      statusEl.textContent = "❌ يجب استخدام رابط HTTPS آمن";
      statusEl.style.color = "red";
    }
  </script>
</body>
</html>
